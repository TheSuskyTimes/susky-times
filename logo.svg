<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b35"/>
      <stop offset="100%" style="stop-color:#1a2f55"/>
    </linearGradient>
    <!-- Serif-style font simulation via paths for "ST" -->
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>

  <!-- Outer gold border rule -->
  <rect x="18" y="18" width="364" height="364" rx="22" fill="none" stroke="#c8922a" stroke-width="2.5"/>
  <rect x="26" y="26" width="348" height="348" rx="18" fill="none" stroke="#c8922a" stroke-width="0.8" opacity="0.4"/>

  <!-- Top rule lines -->
  <line x1="48" y1="72" x2="352" y2="72" stroke="#c8922a" stroke-width="1.5"/>
  <line x1="48" y1="78" x2="352" y2="78" stroke="#c8922a" stroke-width="0.6" opacity="0.5"/>

  <!-- Bottom rule lines -->
  <line x1="48" y1="322" x2="352" y2="322" stroke="#c8922a" stroke-width="1.5"/>
  <line x1="48" y1="328" x2="352" y2="328" stroke="#c8922a" stroke-width="0.6" opacity="0.5"/>

  <!-- "THE" small cap label above -->
  <text x="200" y="65" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-weight="400" fill="#c8922a" letter-spacing="8">THE</text>

  <!-- Main "ST" monogram — bold serif letterforms -->
  <!-- S -->
  <text x="118" y="272" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="190" font-weight="700" fill="white" letter-spacing="-8">S</text>
  <!-- T in gold -->
  <text x="282" y="272" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="190" font-weight="700" fill="#c8922a" letter-spacing="-8">T</text>

  <!-- Thin vertical divider between letters -->
  <line x1="200" y1="105" x2="200" y2="280" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="200" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)" letter-spacing="5">SUSKY TIMES</text>
</svg>
